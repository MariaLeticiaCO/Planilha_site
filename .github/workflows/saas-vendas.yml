name: SaaS Controle de Vendas

on:
  push:
    paths: ['saas-vendas/**', '.github/workflows/saas-vendas.yml']
  pull_request:
    paths: ['saas-vendas/**', '.github/workflows/saas-vendas.yml']

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas-vendas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: saas-vendas/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_PROVIDER: sqlite
